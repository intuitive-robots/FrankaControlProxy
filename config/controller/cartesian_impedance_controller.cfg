name: CartesianImpedance
command_topic: cartesian_pose_command

# Cartesian stiffness gains (diagonal)
# Position stiffness (N/m)
Kp_p: [750, 750, 750]
# Orientation stiffness (Nm/rad)
Kp_r: [15, 15, 15]

# Damping gains are computed automatically as critically damped: Kd = 2 * sqrt(Kp)

# Set to true if robot already compensates gravity internally
ignore_gravity: true
