name: HybridJointImpedanceCompliant
# Compliant teleoperation preset for contact-rich tasks (PCIe / connector insertion).
# Control mode "HybridJointImpedanceCompliant"; the stiff preset is hybrid_joint_impedance_controller.yaml.
#
# Starting values (2026-10-28), derived from the stiff preset, not yet measured on the robot:
# - Cartesian gains (kx, base frame axes x y z rx ry rz) carry the compliance: soft laterally and in
#   rotation so the part can self-align in the slot, stiffer along z so pushing down still builds force.
#   Contact force ~ kx * (GELLO pose - actual pose): at 400 N/m, 20 N of insertion force needs the
#   operator to command 5 cm past the contact. Raise kx z if insertion needs more force.
# - Joint gains (kq) only hold the null space (elbow); they stiffen the EE too, so they stay low.
#   Even small kq stiffen the EE a lot (long lever of j2/j4): with these values the EE stiffness around
#   the DROID home pose is ~300/230/460 N/m (x/y/z) and ~33/26/22 Nm/rad, vs 2600/640/1600 N/m and
#   ~200/190/90 Nm/rad for the stiff preset. Lower kq barely softens it further.
#   j5 ends up at ~30 Nm/rad, the limit where it starts to stick and slip on joint friction.
# - Damping relative to stiffness is higher than in the stiff preset (damping ratio ~0.5 for an
#   effective EE mass of ~3 kg) so the soft arm does not wobble in free space.
# Tune with: pixi run -e client teleop-tracking-check (free space: ringing / overshoot; expect
# more lag than the stiff preset, that is the price of compliance).
kq_gains: [5, 8, 5, 8, 15, 5, 3]
kqd_gains: [1.5, 4, 1.5, 3, 0.8, 0.8, 0.5]
kx_gains: [130, 200, 400, 8, 15, 15]
kxd_gains: [25, 25, 35, 1.0, 1.0, 1.0]

ignore_gravity: true

# Feed-forward: higher than the stiff preset (0.5) because the higher damping ratio would otherwise
# lag by Kd/Kp ~ 100+ ms; overshoot is less of a concern with soft gains.
velocity_feedforward: 0.8
# Inertia feed-forward (reference acceleration through M(q)), 0 = off. Matters most
# here: with soft gains the arm otherwise only accelerates once it has fallen behind.
acceleration_feedforward: 0.5
# Limits of the reference trajectory, same as the stiff preset; see there
max_velocity: [1.0, 1.0, 1.0, 1.0, 1.3, 1.3, 1.3]
max_acceleration: [4.0, 2.5, 3.0, 4.0, 5.0, 6.0, 6.0]
max_jerk: [200, 120, 160, 200, 240, 320, 320]
extrapolate_position: true
feedforward_timeout: 0.05
# Feed-forward wrench (topic <robot>/ee_wrench_command, e.g. the insertion push of the kinesthetic
# replay): applied as J^T * wrench at the flange, norm-limited, dropped when older than the timeout [s]
max_ee_force: 30.0
max_ee_torque: 3.0
ee_wrench_timeout: 0.1
