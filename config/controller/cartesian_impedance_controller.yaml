name: CartesianImpedance

# Cartesian stiffness gains (diagonal)
# Position stiffness (N/m)
Kp_p: [750, 750, 750]
Kd_p: [55, 55, 55]
# Orientation stiffness (Nm/rad)
Kp_r: [45, 45, 45]
Kd_r: [5, 5, 5]


max_torque: 8.0

# Commanded twist (pos_vel / rot_vel) as damping reference and to move the setpoint between
# commands. 0 = old behaviour (damper brakes towards zero velocity).
velocity_feedforward: 1.0
extrapolate_pose: true
# Feed-forward stops when no command arrived for this long [s]
feedforward_timeout: 0.1
